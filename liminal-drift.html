<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liminal Drift — Generative Art Viewer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --anthropic-dark: #141413;
            --anthropic-light: #faf9f5;
            --anthropic-mid-gray: #b0aea5;
            --anthropic-light-gray: #e8e6dc;
            --anthropic-orange: #d97757;
            --anthropic-blue: #6a9bcc;
            --anthropic-green: #788c5d;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, var(--anthropic-light) 0%, #f5f3ee 100%); min-height: 100vh; color: var(--anthropic-dark); }
        .container { display: flex; min-height: 100vh; padding: 20px; gap: 20px; }
        .sidebar { width: 320px; flex-shrink: 0; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); padding: 24px; border-radius: 12px; box-shadow: 0 10px 30px rgba(20, 20, 19, 0.1); overflow-y: auto; overflow-x: hidden; }
        .sidebar h1 { font-family: 'Lora', serif; font-size: 24px; font-weight: 500; color: var(--anthropic-dark); margin-bottom: 8px; }
        .sidebar .subtitle { color: var(--anthropic-mid-gray); font-size: 14px; margin-bottom: 32px; line-height: 1.4; }
        .control-section { margin-bottom: 32px; }
        .control-section h3 { font-size: 16px; font-weight: 600; color: var(--anthropic-dark); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        .control-section h3::before { content: '◈'; color: var(--anthropic-orange); font-weight: bold; }
        .seed-input { width: 100%; background: var(--anthropic-light); padding: 12px; border-radius: 8px; font-family: 'Courier New', monospace; font-size: 14px; margin-bottom: 12px; border: 1px solid var(--anthropic-light-gray); text-align: center; }
        .seed-input:focus { outline: none; border-color: var(--anthropic-orange); box-shadow: 0 0 0 2px rgba(217, 119, 87, 0.1); background: white; }
        .seed-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
        .regen-button { margin-bottom: 0; }
        .control-group { margin-bottom: 20px; }
        .control-group label { display: block; font-size: 14px; font-weight: 500; color: var(--anthropic-dark); margin-bottom: 8px; }
        .slider-container { display: flex; align-items: center; gap: 12px; }
        .slider-container input[type="range"] { flex: 1; height: 4px; background: var(--anthropic-light-gray); border-radius: 2px; outline: none; -webkit-appearance: none; }
        .slider-container input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; background: var(--anthropic-orange); border-radius: 50%; cursor: pointer; transition: all 0.2s ease; }
        .slider-container input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.1); background: #c86641; }
        .slider-container input[type="range"]::-moz-range-thumb { width: 16px; height: 16px; background: var(--anthropic-orange); border-radius: 50%; border: none; cursor: pointer; transition: all 0.2s ease; }
        .value-display { font-family: 'Courier New', monospace; font-size: 12px; color: var(--anthropic-mid-gray); min-width: 60px; text-align: right; }
        .color-group { margin-bottom: 16px; }
        .color-group label { display: block; font-size: 12px; color: var(--anthropic-mid-gray); margin-bottom: 4px; }
        .color-picker-container { display: flex; align-items: center; gap: 8px; }
        .color-picker-container input[type="color"] { width: 32px; height: 32px; border: none; border-radius: 6px; cursor: pointer; background: none; padding: 0; }
        .color-value { font-family: 'Courier New', monospace; font-size: 12px; color: var(--anthropic-mid-gray); }
        .button { background: var(--anthropic-orange); color: white; border: none; padding: 10px 16px; border-radius: 6px; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s ease; width: 100%; }
        .button:hover { background: #c86641; transform: translateY(-1px); }
        .button:active { transform: translateY(0); }
        .button.secondary { background: var(--anthropic-blue); }
        .button.secondary:hover { background: #5a8bb8; }
        .button.tertiary { background: var(--anthropic-green); }
        .button.tertiary:hover { background: #6b7b52; }
        .button-row { display: flex; gap: 8px; }
        .button-row .button { flex: 1; }
        .canvas-area { flex: 1; display: flex; align-items: center; justify-content: center; min-width: 0; }
        #canvas-container { width: 100%; max-width: 1000px; border-radius: 12px; overflow: hidden; box-shadow: 0 20px 40px rgba(20, 20, 19, 0.1); background: white; }
        #canvas-container canvas { display: block; width: 100% !important; height: auto !important; }
        .loading { display: flex; align-items: center; justify-content: center; font-size: 18px; color: var(--anthropic-mid-gray); }
        @media (max-width: 600px) { .container { flex-direction: column; } .sidebar { width: 100%; } .canvas-area { padding: 20px; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h1>Liminal Drift</h1>
            <div class="subtitle">Autonomous particles drifting across layered noise fields, tracing the threshold between order and dissolution. Each seed reveals a unique liminal landscape.</div>
            <div class="control-section">
                <h3>Seed</h3>
                <input type="number" id="seed-input" class="seed-input" value="12345" onchange="updateSeed()">
                <div class="seed-controls">
                    <button class="button secondary" onclick="previousSeed()">← Prev</button>
                    <button class="button secondary" onclick="nextSeed()">Next →</button>
                </div>
                <button class="button tertiary regen-button" onclick="randomSeedAndUpdate()">🎲 Random</button>
            </div>
            <div class="control-section">
                <h3>Parameters</h3>
                <div class="control-group">
                    <label>Particle Count</label>
                    <div class="slider-container">
                        <input type="range" id="particleCount" min="500" max="8000" step="100" value="3000" oninput="updateParam('particleCount', this.value)">
                        <span class="value-display" id="particleCount-value">3000</span>
                    </div>
                </div>
                <div class="control-group">
                    <label>Flow Speed</label>
                    <div class="slider-container">
                        <input type="range" id="flowSpeed" min="0.2" max="3.0" step="0.1" value="1.2" oninput="updateParam('flowSpeed', this.value)">
                        <span class="value-display" id="flowSpeed-value">1.2</span>
                    </div>
                </div>
                <div class="control-group">
                    <label>Noise Scale</label>
                    <div class="slider-container">
                        <input type="range" id="noiseScale" min="0.001" max="0.015" step="0.001" value="0.004" oninput="updateParam('noiseScale', this.value)">
                        <span class="value-display" id="noiseScale-value">0.004</span>
                    </div>
                </div>
                <div class="control-group">
                    <label>Inertia (Damping)</label>
                    <div class="slider-container">
                        <input type="range" id="damping" min="0.85" max="0.99" step="0.01" value="0.92" oninput="updateParam('damping', this.value)">
                        <span class="value-display" id="damping-value">0.92</span>
                    </div>
                </div>
                <div class="control-group">
                    <label>Trail Fade</label>
                    <div class="slider-container">
                        <input type="range" id="trailFade" min="1" max="20" step="1" value="8" oninput="updateParam('trailFade', this.value)">
                        <span class="value-display" id="trailFade-value">8</span>
                    </div>
                </div>
                <div class="control-group">
                    <label>Turbulence</label>
                    <div class="slider-container">
                        <input type="range" id="turbulence" min="0" max="1.0" step="0.05" value="0.3" oninput="updateParam('turbulence', this.value)">
                        <span class="value-display" id="turbulence-value">0.3</span>
                    </div>
                </div>
            </div>
            <div class="control-section">
                <h3>Colors</h3>
                <div class="color-group">
                    <label>Warm Glow</label>
                    <div class="color-picker-container">
                        <input type="color" id="color1" value="#d97757" onchange="updateColor('color1', this.value)">
                        <span class="color-value" id="color1-value">#d97757</span>
                    </div>
                </div>
                <div class="color-group">
                    <label>Cool Shadow</label>
                    <div class="color-picker-container">
                        <input type="color" id="color2" value="#6a9bcc" onchange="updateColor('color2', this.value)">
                        <span class="color-value" id="color2-value">#6a9bcc</span>
                    </div>
                </div>
                <div class="color-group">
                    <label>Deep Accent</label>
                    <div class="color-picker-container">
                        <input type="color" id="color3" value="#3d5a73" onchange="updateColor('color3', this.value)">
                        <span class="color-value" id="color3-value">#3d5a73</span>
                    </div>
                </div>
            </div>
            <div class="control-section">
                <h3>Actions</h3>
                <div class="button-row">
                    <button class="button" onclick="regenerate()">Regenerate</button>
                    <button class="button secondary" onclick="resetParameters()">Reset</button>
                </div>
                <div style="margin-top: 8px;">
                    <button class="button tertiary" onclick="downloadPNG()">Download PNG</button>
                </div>
            </div>
        </div>
        <div class="canvas-area">
            <div id="canvas-container">
                <div class="loading">Initializing liminal drift...</div>
            </div>
        </div>
    </div>

    <script>
        let params = {
            seed: 12345,
            particleCount: 3000,
            flowSpeed: 1.2,
            noiseScale: 0.004,
            damping: 0.92,
            trailFade: 8,
            turbulence: 0.3,
            colorPalette: ['#d97757', '#6a9bcc', '#3d5a73']
        };

        // ✅ FIX 1: DEEP COPY
        let defaultParams = JSON.parse(JSON.stringify(params)); 

        let particles = [];
        let noiseOffsetZ = 0;
        let canvas;

        function setup() {
            canvas = createCanvas(1200, 1200);
            canvas.parent('canvas-container');
            initializeSystem();
            document.querySelector('.loading').style.display = 'none';
        }

        function initializeSystem() {
            randomSeed(params.seed);
            noiseSeed(params.seed);
            noiseOffsetZ = 0;
            particles = [];
            for (let i = 0; i < params.particleCount; i++) {
                particles.push(new Particle());
            }
            background(250, 249, 245);
        }

        function draw() {
            noStroke();
            fill(250, 249, 245, params.trailFade);
            rect(0, 0, width, height);
            for (let p of particles) {
                p.update();
                p.display();
                p.edges();
            }
            noiseOffsetZ += 0.0003;
        }

        class Particle {
            constructor() {
                this.x = random(width);
                this.y = random(height);
                this.vx = 0;
                this.vy = 0;
                this.speed = random(0.5, 2);
                this.life = random(100, 255);
                this.maxLife = this.life;
                this.history = [];
                this.historyLength = 5;
            }

            update() {
                this.history.push({x: this.x, y: this.y});
                if (this.history.length > this.historyLength) {
                    this.history.shift();
                }

                let angle = noise(
                    this.x * params.noiseScale,
                    this.y * params.noiseScale,
                    noiseOffsetZ
                ) * TWO_PI * 2;

                let turb = noise(
                    this.x * params.noiseScale * 3 + 1000,
                    this.y * params.noiseScale * 3 + 1000,
                    noiseOffsetZ * 2
                ) - 0.5;
                
                angle += turb * params.turbulence * PI;
                let fx = cos(angle) * params.flowSpeed * this.speed;
                let fy = sin(angle) * params.flowSpeed * this.speed;

                this.vx = this.vx * params.damping + fx * (1 - params.damping);
                this.vy = this.vy * params.damping + fy * (1 - params.damping);
                this.x += this.vx;
                this.y += this.vy;
                this.life -= 0.3;
            }

            display() {
                if (this.life <= 0) return;
                let lifeRatio = this.life / this.maxLife;
                let speed = sqrt(this.vx * this.vx + this.vy * this.vy);
                let speedRatio = constrain(speed / (params.flowSpeed * 2), 0, 1);

                let c1 = color(params.colorPalette[0]);
                let c2 = color(params.colorPalette[1]);
                let c3 = color(params.colorPalette[2]);

                let col;
                if (speedRatio < 0.5) {
                    col = lerpColor(c2, c3, speedRatio * 2);
                } else {
                    col = lerpColor(c1, c2, (speedRatio - 0.5) * 2);
                }

                let alpha = lifeRatio * 180;
                
                // ✅ FIX 2: EXTRACT RGB ONCE
                let r = red(col);
                let g = green(col);
                let b = blue(col);

                noFill();
                strokeWeight(1.5 * lifeRatio);
                
                if (this.history.length > 1) {
                    for (let i = 1; i < this.history.length; i++) {
                        let progress = i / this.history.length;
                        let trailAlpha = alpha * progress * 0.5;
                        stroke(r, g, b, trailAlpha);
                        line(this.history[i-1].x, this.history[i-1].y, this.history[i].x, this.history[i].y);
                    }
                }

                stroke(r, g, b, alpha);
                if (this.history.length > 0) {
                    let last = this.history[this.history.length - 1];
                    line(last.x, last.y, this.x, this.y);
                }
            }

            edges() {
                if (this.life <= 0 || this.x < -50 || this.x > width + 50 || this.y < -50 || this.y > height + 50) {
                    this.respawn();
                }
            }

            respawn() {
                let edge = floor(random(4));
                switch(edge) {
                    case 0: this.x = random(width); this.y = -10; break;
                    case 1: this.x = width + 10; this.y = random(height); break;
                    case 2: this.x = random(width); this.y = height + 10; break;
                    case 3: this.x = -10; this.y = random(height); break;
                }
                this.vx = 0;
                this.vy = 0;
                this.life = random(150, 300);
                this.maxLife = this.life;
                this.history = [];
                this.speed = random(0.5, 2);
            }
        }

        function updateParam(paramName, value) {
            params[paramName] = parseFloat(value);
            document.getElementById(paramName + '-value').textContent = value;
            if (paramName === 'particleCount') { initializeSystem(); }
        }

        function updateColor(colorId, value) {
            let index = parseInt(colorId.replace('color', '')) - 1;
            params.colorPalette[index] = value;
            document.getElementById(colorId + '-value').textContent = value;
        }

        function updateSeedDisplay() { document.getElementById('seed-input').value = params.seed; }
        function updateSeed() {
            let newSeed = parseInt(document.getElementById('seed-input').value);
            if (newSeed && newSeed > 0) { params.seed = newSeed; initializeSystem(); } 
            else { updateSeedDisplay(); }
        }
        function previousSeed() { params.seed = Math.max(1, params.seed - 1); updateSeedDisplay(); initializeSystem(); }
        function nextSeed() { params.seed = params.seed + 1; updateSeedDisplay(); initializeSystem(); }
        function randomSeedAndUpdate() { params.seed = Math.floor(Math.random() * 999999) + 1; updateSeedDisplay(); initializeSystem(); }
        function regenerate() { initializeSystem(); }

        function resetParameters() {
            params = JSON.parse(JSON.stringify(defaultParams));
            document.getElementById('particleCount').value = params.particleCount;
            document.getElementById('particleCount-value').textContent = params.particleCount;
            document.getElementById('flowSpeed').value = params.flowSpeed;
            document.getElementById('flowSpeed-value').textContent = params.flowSpeed;
            document.getElementById('noiseScale').value = params.noiseScale;
            document.getElementById('noiseScale-value').textContent = params.noiseScale;
            document.getElementById('damping').value = params.damping;
            document.getElementById('damping-value').textContent = params.damping;
            document.getElementById('trailFade').value = params.trailFade;
            document.getElementById('trailFade-value').textContent = params.trailFade;
            document.getElementById('turbulence').value = params.turbulence;
            document.getElementById('turbulence-value').textContent = params.turbulence;
            document.getElementById('color1').value = params.colorPalette[0];
            document.getElementById('color1-value').textContent = params.colorPalette[0];
            document.getElementById('color2').value = params.colorPalette[1];
            document.getElementById('color2-value').textContent = params.colorPalette[1];
            document.getElementById('color3').value = params.colorPalette[2];
            document.getElementById('color3-value').textContent = params.colorPalette[2];
            updateSeedDisplay();
            initializeSystem();
        }

        function downloadPNG() { saveCanvas(canvas, 'liminal-drift-seed-' + params.seed, 'png'); }
        window.addEventListener('load', function() { updateSeedDisplay(); });
    </script>
</body>
</html>
